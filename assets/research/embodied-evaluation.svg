<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Embodied-SocialSim evaluation matrix</title>
  <desc id="desc">A layered evaluation matrix separating perception, planning, execution, social reasoning, reliability, and transfer.</desc>
  <rect width="1200" height="650" rx="22" fill="#f7f6f2"/>
  <text x="52" y="58" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#3379a8">EMBODIED-SOCIALSIM / EVALUATION MATRIX</text>
  <text x="52" y="94" font-family="Arial,sans-serif" font-size="16" fill="#65707b">Separate what the robot failed to perceive, plan, execute, or understand socially.</text>
  <g font-family="Arial,sans-serif" font-size="14">
    <rect x="52" y="130" width="1096" height="48" rx="7" fill="#182b3d"/><text x="75" y="161" fill="#fff" font-weight="700">AXIS</text><text x="295" y="161" fill="#c9d8df" font-weight="700">CONTROL CONDITION</text><text x="650" y="161" fill="#c9d8df" font-weight="700">WHAT TO RECORD</text>
    <g transform="translate(52 198)"><rect width="1096" height="55" rx="7" fill="#fff" stroke="#d9dde0"/><rect width="180" height="55" rx="7" fill="#faece7"/><text x="20" y="34" fill="#a44331" font-weight="700">PERCEPTION</text><text x="240" y="34" fill="#46545d">fixed plan, changed visual input</text><text x="598" y="34" fill="#46545d">detection · tracking · state consistency</text></g>
    <g transform="translate(52 265)"><rect width="1096" height="55" rx="7" fill="#fff" stroke="#d9dde0"/><rect width="180" height="55" rx="7" fill="#e7f0f5"/><text x="20" y="34" fill="#28638e" font-weight="700">PLANNING</text><text x="240" y="34" fill="#46545d">oracle perception, same execution</text><text x="598" y="34" fill="#46545d">feasible plans · constraints · replans</text></g>
    <g transform="translate(52 332)"><rect width="1096" height="55" rx="7" fill="#fff" stroke="#d9dde0"/><rect width="180" height="55" rx="7" fill="#fbf4e3"/><text x="20" y="34" fill="#8a6b29" font-weight="700">EXECUTION</text><text x="240" y="34" fill="#46545d">fixed high-level plan, injected faults</text><text x="598" y="34" fill="#46545d">latency · retry · acknowledgement · recovery</text></g>
    <g transform="translate(52 399)"><rect width="1096" height="55" rx="7" fill="#fff" stroke="#d9dde0"/><rect width="180" height="55" rx="7" fill="#eeeaf6"/><text x="20" y="34" fill="#6f5b9d" font-weight="700">SOCIAL REASONING</text><text x="240" y="34" fill="#46545d">planning oracle, altered norms/relations</text><text x="598" y="34" fill="#46545d">norm compliance · cooperation · conflict</text></g>
    <g transform="translate(52 466)"><rect width="1096" height="55" rx="7" fill="#fff" stroke="#d9dde0"/><rect width="180" height="55" rx="7" fill="#eaf3e2"/><text x="20" y="34" fill="#557f3e" font-weight="700">RELIABILITY</text><text x="240" y="34" fill="#46545d">interruptions, refusals, state drift</text><text x="598" y="34" fill="#46545d">trace completeness · takeover · safe stop</text></g>
    <g transform="translate(52 533)"><rect width="1096" height="55" rx="7" fill="#fff" stroke="#d9dde0"/><rect width="180" height="55" rx="7" fill="#eef1f2"/><text x="20" y="34" fill="#60717c" font-weight="700">TRANSFER</text><text x="240" y="34" fill="#46545d">simulation → higher fidelity → device</text><text x="598" y="34" fill="#46545d">behavior retention · gap · uncovered risk</text></g>
  </g>
</svg>
